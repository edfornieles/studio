<a class="article" href="{{ url_for('site_exhibition', pid=p.project_id) }}">
  <div class="image-wrap">
    {% set src = p.thumb.source_url or (url_for('local_asset', relpath=p.thumb.local_path) if p.thumb and p.thumb.local_path else '') if p.thumb else '' %}
    {% if src %}<img class="autocrop" src="{{ src }}" loading="lazy" alt="{{ ARTIST_NAME }}, {{ p.title }}">{% endif %}
  </div>
  <div class="text">
    <div class="title">{{ p.title }}</div>
    <div class="date">{{ p.year if p.year else p.date }}</div>
  </div>
</a>
