<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jabber</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jabber">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/lab/cover.png">
<style>
:root {
  --bg: #f6f3ec; --ink: #1d1c1a; --soft: #6f6b63; --faint: #dcd7cb; --accent: #9a4a2e;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141413; --ink: #ece8df; --soft: #8f8a80; --faint: #34322e; --accent: #d98b6a; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%; }
body { font: 16px/1.5 var(--sans); }
main { max-width: 560px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom)); }
.top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--soft); }
.top b { color: var(--ink); font-weight: 600; font-size: 15px; letter-spacing: -.01em; }

.player { min-height: calc(100svh - 70px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
.book { margin-top: 7vh; }
.book p { margin: 0; color: var(--soft); font-size: 13px; letter-spacing: .02em; }
.book h1 { font: 400 28px/1.15 var(--serif); margin: 8px 0 0; letter-spacing: -.01em; }
.tag { display: inline-block; margin-top: 10px; font-size: 12px; color: var(--accent); }

.now { margin: 5vh 0 0; font: 21px/1.55 var(--serif); min-height: 8em; }
.now .prev { display: block; color: var(--soft); font-size: 16px; margin-bottom: 10px; opacity: .75; }

.bar { margin-top: auto; padding-top: 24px; }
.track { position: relative; height: 22px; cursor: pointer; touch-action: none; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--faint); border-radius: 2px; }
.fill { position: absolute; left: 0; top: 10px; height: 2px; background: var(--ink); border-radius: 2px; width: 0; }
.times { display: flex; justify-content: space-between; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--soft); }
.controls { display: flex; justify-content: center; align-items: center; gap: 30px; margin: 20px 0 4px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.skip { font-size: 13px; color: var(--soft); width: 52px; height: 52px; border-radius: 50%; }
.skip:active, .rate:active { background: var(--faint); }
.play { width: 72px; height: 72px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.play svg { width: 26px; height: 26px; fill: currentColor; }
.play:active { transform: scale(.96); }
.rate { font-size: 12px; color: var(--soft); padding: 6px 10px; border-radius: 14px; font-variant-numeric: tabular-nums; }
.sub { display: flex; justify-content: center; margin-top: 6px; }

h2 { font: 600 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); margin: 40px 0 0; }
.sections { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--faint); }
.sections button { width: 100%; display: flex; gap: 12px; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--faint); font-size: 15px; text-align: left; line-height: 1.35; }
.sections .t { flex: 1; }
.sections .d { color: var(--soft); font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
.sections .mark { color: var(--accent); font-size: 12px; display: block; margin-top: 3px; }
.sections li.on button { color: var(--accent); }
.sections li.wait button { color: var(--soft); opacity: .55; cursor: default; }
.progress { font-size: 13px; color: var(--soft); margin-top: 8px; }

.note { margin-top: 14px; padding: 14px 16px; border-left: 2px solid var(--accent); font: 15px/1.55 var(--serif); white-space: pre-wrap; background: color-mix(in srgb, var(--faint) 30%, transparent); border-radius: 0 8px 8px 0; }

details { margin-top: 36px; color: var(--soft); font-size: 13px; }
summary { cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
pre { font: 11px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; background: color-mix(in srgb, var(--faint) 40%, transparent); padding: 12px; border-radius: 8px; color: var(--ink); }
.link { color: var(--accent); font-size: 13px; margin-right: 16px; }
.msg { margin-top: 30vh; font: 20px/1.5 var(--serif); }
.describe { display: block; margin: 18px auto 0; padding: 10px 18px; border: 1px solid var(--accent); color: var(--accent); border-radius: 22px; font-size: 14px; }
.describe:active { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.figure { margin-top: 14px; font: 16px/1.6 var(--serif); }
.figure small { display: block; font: 12px/1.4 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
</style>
</head>
<body>
<main>
  <div class="top"><b>Jabber</b><span id="status"></span></div>

  <section class="player">
    <div class="book">
      <p id="bookTitle"></p>
      <h1 id="title">Loading…</h1>
      <span class="tag" id="tag" hidden>◆ A Mother suggestion</span>
    </div>
    <p class="now" id="now"></p>
    <div class="note" id="note" hidden></div>
    <div class="figure" id="figure" hidden></div>
    <button class="describe" id="describe" hidden>Describe this image</button>
    <div class="bar">
      <div class="track" id="track" role="slider" aria-label="Position in section" tabindex="0"><div class="fill" id="fill"></div></div>
      <div class="times"><span id="cur">0:00</span><span id="secpos"></span><span id="dur">0:00</span></div>
      <div class="controls">
        <button class="skip" id="back" aria-label="Back 15 seconds">−15</button>
        <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="icon"><path d="M7 4.5v15l13-7.5z"/></svg></button>
        <button class="skip" id="fwd" aria-label="Forward 30 seconds">+30</button>
      </div>
      <div class="sub"><button class="rate" id="rate" aria-label="Playback speed">1×</button></div>
    </div>
  </section>

  <h2>Contents</h2>
  <p class="progress" id="progress"></p>
  <ul class="sections" id="sections"></ul>

  <details>
    <summary>Playback log</summary>
    <pre id="log"></pre>
    <button class="link" id="copy">Copy log</button>
  </details>
</main>

<audio id="audio" preload="auto" playsinline></audio>

<script>
// Book player: one <audio> element, one MP3 per section, Media Session for
// lock-screen controls. Book files live under /library/<id>/ behind a key.
const $ = id => document.getElementById(id);
const audio = $('audio');
const params = new URLSearchParams(location.search);
const BOOK = params.get('book') || 'source';
const KEY = params.get('key') || '';
const base = `/library/${encodeURIComponent(BOOK)}/`;
const q = KEY ? `?key=${encodeURIComponent(KEY)}` : '';
const POSKEY = `jabber-pos-${BOOK}`, LOGKEY = 'jabber-log', RATEKEY = 'jabber-rate';
const RATES = [1, 1.15, 1.3, 1.5, 0.9];
let m = null, idx = 0, sentences = [], wantPlaying = false, lastSave = 0, waitingForNext = false;
let describing = null; // {fig, returnTo: {idx, t}} while an image description plays

// ---------- log ----------
let entries = [];
try { entries = JSON.parse(localStorage.getItem(LOGKEY) || '[]'); } catch {}
function log(msg) {
  entries.push(`${new Date().toLocaleTimeString([], { hour12: false })} ${msg}`);
  if (entries.length > 300) entries = entries.slice(-300);
  try { localStorage.setItem(LOGKEY, JSON.stringify(entries)); } catch {}
  $('log').textContent = entries.slice(-100).join('\n');
}
$('log').textContent = entries.slice(-100).join('\n');
$('copy').onclick = async () => { try { await navigator.clipboard.writeText(entries.join('\n')); $('copy').textContent = 'Copied'; } catch { $('copy').textContent = 'Copy failed'; } };

const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), mm = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(mm).padStart(2, '0')}:${ss}` : `${mm}:${ss}`; };
const ready = i => !!m.sections[i]?.file;
const nextReady = i => { for (let k = i + 1; k < m.sections.length; k++) if (ready(k)) return k; return -1; };

// Notes (PDF sticky notes) that fall inside a section's pages.
const notesFor = s => (m.notes || []).filter(n => s.pages && n.page >= s.pages[0] && n.page <= s.pages[1]);

// ---------- loading ----------
async function fetchManifest() {
  const r = await fetch(base + 'manifest.json' + q, { cache: 'no-cache' });
  if (r.status === 401) throw new Error('private');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function load() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  log(`--- open ${BOOK} · home screen: ${!!(navigator.standalone || matchMedia('(display-mode: standalone)').matches)}`);
  try { m = await fetchManifest(); }
  catch (e) {
    document.querySelector('main').innerHTML = `<div class="top"><b>Jabber</b></div><p class="msg">${e.message === 'private' ? 'This book is private. Open it with your personal link.' : 'Could not load the book (' + e.message + ').'}</p>`;
    return;
  }
  document.title = m.title.split(':')[0] + ' · Jabber';
  $('bookTitle').textContent = m.title;
  renderList();
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(POSKEY)); } catch {}
  let start = saved && ready(saved.idx) ? saved.idx : m.sections.findIndex((s, i) => ready(i) && s.kind !== 'notes');
  if (start < 0) start = m.sections.findIndex((s, i) => ready(i));
  if (start < 0) { $('title').textContent = 'Preparing the first section…'; setTimeout(refresh, 30000); return; }
  select(start, saved && saved.idx === start ? saved.t : 0);
  const r = Number(localStorage.getItem(RATEKEY)) || 1;
  setRate(r);
  setInterval(refresh, 60000);
}

async function refresh() {
  try {
    const fresh = await fetchManifest();
    const before = m ? m.sections.filter((s, i) => ready(i)).length : 0;
    m = fresh;
    const after = m.sections.filter((s, i) => ready(i)).length;
    if (after !== before) { renderList(); log(`${after - before} more section(s) ready`); }
    if (!audio.src && after) { load(); return; }
    if (waitingForNext) { const n = nextReady(idx); if (n >= 0) { waitingForNext = false; select(n); play(); log('resumed with ' + m.sections[n].id); } }
  } catch (e) { log('refresh failed ' + e.message); }
}

function renderList() {
  const ul = $('sections');
  ul.replaceChildren();
  let total = 0, doneSecs = 0;
  m.sections.forEach((s, i) => {
    const li = document.createElement('li');
    if (!ready(i)) li.className = 'wait';
    if (i === idx && audio.src) li.classList.add('on');
    const b = document.createElement('button');
    const t = document.createElement('span'); t.className = 't'; t.textContent = s.title;
    if (notesFor(s).length || s.kind === 'notes') { const mk = document.createElement('span'); mk.className = 'mark'; mk.textContent = s.kind === 'notes' ? '◆ Notes' : '◆ Mother suggestion'; t.append(mk); }
    const d = document.createElement('span'); d.className = 'd'; d.textContent = ready(i) ? fmt(s.duration) : 'preparing';
    b.append(t, d);
    b.onclick = () => { if (ready(i)) { describing = null; $('figure').hidden = true; select(i, 0); play(); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
    li.append(b); ul.append(li);
    if (ready(i)) { doneSecs++; total += s.duration; }
  });
  $('progress').textContent = doneSecs < m.sections.length
    ? `${doneSecs} of ${m.sections.length} sections ready · ${fmt(total)} so far. The rest are still being generated.`
    : `${m.sections.length} sections · ${fmt(total)}`;
}

function select(i, t = 0) {
  idx = i;
  const s = m.sections[i];
  sentences = s.sentences || [];
  audio.src = base + s.file + q;
  audio.playbackRate = audio.defaultPlaybackRate = Number(localStorage.getItem(RATEKEY)) || 1;
  if (t) { const seek = () => { audio.currentTime = t; audio.removeEventListener('loadedmetadata', seek); }; audio.addEventListener('loadedmetadata', seek); }
  $('title').textContent = s.title;
  const notes = s.kind === 'notes' ? [] : notesFor(s);
  $('tag').hidden = !notes.length;
  $('note').hidden = !notes.length;
  $('note').textContent = notes.map(n => n.text.replace(/\n\nStatus:[\s\S]*$/, '')).join('\n\n');
  [...$('sections').children].forEach((li, k) => li.classList.toggle('on', k === i));
  $('secpos').textContent = `${i + 1} / ${m.sections.length}`;
  setMetadata();
  const n = nextReady(i);
  if (n >= 0) fetch(base + m.sections[n].file + q).then(r => r.blob()).then(b => log(`prefetched ${m.sections[n].id} (${Math.round(b.size / 1024)} KB)`)).catch(() => {});
  render();
}

function setMetadata() {
  if (!('mediaSession' in navigator) || !m) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: m.sections[idx].title, artist: m.title.split(':')[0], album: 'Jabber',
    artwork: [{ src: location.origin + '/lab/cover.png', sizes: '512x512', type: 'image/png' }],
  });
}

// ---------- playback ----------
function play() { wantPlaying = true; audio.play()?.catch(e => log(`play() rejected: ${e.name} ${e.message}`)); }
function pause() { wantPlaying = false; audio.pause(); }
function seekBy(d) { audio.currentTime = Math.max(0, Math.min((audio.duration || 0) - 0.5, audio.currentTime + d)); }
function setRate(r) {
  audio.playbackRate = audio.defaultPlaybackRate = r;
  $('rate').textContent = `${r}×`;
  try { localStorage.setItem(RATEKEY, String(r)); } catch {}
}
$('rate').onclick = () => setRate(RATES[(RATES.indexOf(audio.playbackRate) + 1) % RATES.length] || 1);
$('play').onclick = () => (audio.paused ? play() : pause());
$('back').onclick = () => seekBy(-15);
$('fwd').onclick = () => seekBy(30);
const track = $('track');
const seekTo = e => { const r = track.getBoundingClientRect(); if (audio.duration) audio.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * audio.duration; };
track.addEventListener('pointerdown', e => { track.setPointerCapture(e.pointerId); seekTo(e); });
track.addEventListener('pointermove', e => { if (e.buttons) seekTo(e); });

if ('mediaSession' in navigator) {
  const h = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch {} };
  h('play', () => { log('lock-screen: play'); play(); });
  h('pause', () => { log('lock-screen: pause'); pause(); });
  h('seekbackward', d => seekBy(-(d.seekOffset || 15)));
  h('seekforward', d => seekBy(d.seekOffset || 30));
  h('seekto', d => { audio.currentTime = d.seekTime; });
  h('previoustrack', () => { if (audio.currentTime > 5) audio.currentTime = 0; else { for (let k = idx - 1; k >= 0; k--) if (ready(k)) { select(k); play(); break; } } });
  h('nexttrack', () => { const n = nextReady(idx); if (n >= 0) { select(n); play(); } });
}

// Section hand-over: starts the next file from the ended handler (no tap needed).
audio.addEventListener('ended', () => {
  if (describing) { endDescription(); return; }
  const n = nextReady(idx);
  log(`ended ${m.sections[idx].id} (locked: ${document.hidden})`);
  if (n >= 0) { select(n); play(); log('hand-over → ' + m.sections[n].id); }
  else if (idx < m.sections.length - 1) { waitingForNext = true; wantPlaying = false; $('now').textContent = 'The next section is still being prepared. It will start when it is ready.'; log('waiting for next section'); }
  else { wantPlaying = false; log('finished the book'); }
});
for (const ev of ['playing', 'pause', 'stalled', 'error']) {
  audio.addEventListener(ev, () => {
    if (ev === 'error') log(`ERROR ${audio.error?.code} at ${m?.sections[idx]?.id}`);
    else if (ev === 'pause' && audio.ended) return;
    else log(`${ev} ${m?.sections[idx]?.id}@${fmt(audio.currentTime)}${document.hidden ? ' [locked]' : ''}${ev === 'pause' && wantPlaying ? ' ← not requested' : ''}`);
    render();
  });
}
let hiddenAt = null;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = { wall: Date.now(), playing: !audio.paused }; }
  else if (hiddenAt) { log(`back after ${fmt((Date.now() - hiddenAt.wall) / 1000)} · ${audio.paused ? 'paused' : 'still playing'}`); hiddenAt = null; refresh(); }
});

// ---------- image descriptions ----------
// The narration says "There's an image here: ... Tap Describe ..." at each
// figure. For 90 s after that cue the Describe button plays the fuller
// description, then returns to the same point in the reading.
function currentFigure() {
  const figs = m?.sections[idx]?.figures || [];
  const t = audio.currentTime;
  let found = null;
  for (const f of figs) if (t >= f.at - 0.5 && t <= f.at + 90) found = f;
  return found;
}
function describeFigure(f) {
  describing = { fig: f, returnTo: { idx, t: audio.currentTime } };
  log(`describe image p${f.page}`);
  audio.src = base + f.file + q;
  audio.playbackRate = Number(localStorage.getItem(RATEKEY)) || 1;
  $('figure').hidden = false;
  $('figure').innerHTML = '';
  const label = document.createElement('small'); label.textContent = `Image · page ${f.page} · ${f.kind}`;
  $('figure').append(label, f.description);
  $('describe').textContent = 'Back to the reading';
  play();
}
function endDescription() {
  const r = describing.returnTo;
  describing = null;
  $('figure').hidden = true;
  select(r.idx, r.t);
  play();
}
$('describe').onclick = () => {
  if (describing) { endDescription(); return; }
  const f = currentFigure();
  if (f) describeFigure(f);
};

// ---------- UI ----------
function render() {
  const d = audio.duration || m?.sections[idx]?.duration || 0;
  $('fill').style.width = d ? (audio.currentTime / d) * 100 + '%' : '0';
  $('cur').textContent = fmt(audio.currentTime);
  $('dur').textContent = fmt(d);
  $('icon').innerHTML = audio.paused ? '<path d="M7 4.5v15l13-7.5z"/>' : '<path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/>';
  $('play').setAttribute('aria-label', audio.paused ? 'Play' : 'Pause');
  const fig = describing ? describing.fig : currentFigure();
  $('describe').hidden = !fig;
  if (!describing) $('describe').textContent = 'Describe this image';
  if (describing) return;
  const t = audio.currentTime;
  let k = sentences.findIndex(s => t < s.end + 0.3);
  if (k < 0) k = sentences.length - 1;
  const now = $('now');
  if (sentences[k] && now.dataset.k !== idx + ':' + k) {
    now.dataset.k = idx + ':' + k;
    now.replaceChildren();
    if (sentences[k - 1]) { const p = document.createElement('span'); p.className = 'prev'; p.textContent = sentences[k - 1].text; now.append(p); }
    now.append(sentences[k].text);
  }
}
audio.addEventListener('timeupdate', () => {
  render();
  if ('mediaSession' in navigator && audio.duration && navigator.mediaSession.setPositionState) {
    try { navigator.mediaSession.setPositionState({ duration: audio.duration, position: Math.min(audio.currentTime, audio.duration), playbackRate: audio.playbackRate }); } catch {}
  }
  if (!describing && Date.now() - lastSave > 5000) { lastSave = Date.now(); try { localStorage.setItem(POSKEY, JSON.stringify({ idx, t: audio.currentTime })); } catch {} }
});
audio.addEventListener('loadedmetadata', render);

load();
</script>
</body>
</html>
